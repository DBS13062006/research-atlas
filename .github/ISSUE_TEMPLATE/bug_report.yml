name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign in as rhea@research-atlas.test
        2. Open …
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Database, Graph or vectors, API, Pages, Query Lab, Data pipeline, Docs, Other]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Errors or logs
      description: Problem responses, console errors or `pnpm verify:all` output. Never paste secrets.
      render: text
